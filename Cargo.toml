[workspace]
members = ["pack-io-derive"]
# `fuzz/` is a separate cargo-fuzz crate that requires nightly +
# libfuzzer-sys. It is deliberately excluded from the main workspace so
# stable / MSRV builds never touch it.
exclude = ["fuzz"]

[package]
name    = "pack-io"
version = "1.0.1"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Compact binary wire format with schema evolution and zero-copy deserialization for Rust. The serialization substrate under network-protocol and Hive DB."

# Keywords (5 max)
keywords = [
    "serialization",
    "codec",
    "binary",
    "schema-evolution",
    "zero-copy"
]

# Categories
categories = [
    "encoding",
    "data-structures",
    "no-std"
]

# Links
homepage      = "https://github.com/jamesgober/pack-io"
repository    = "https://github.com/jamesgober/pack-io"
documentation = "https://docs.rs/pack-io"

# Authors
authors = [
    "James Gober <me@jamesgober.com>"
]

# Published files. Everything a user or docs.rs needs to build, read, and
# verify the crate; CI configuration, benchmarks, fuzz harness, golden
# vectors and the REPS standard stay in the repository only.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/docs/API.md",
    "/docs/MIGRATION.md",
    "/docs/WIRE_FORMAT.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pack_io"
path = "src/lib.rs"



# FEATURE FLAGS
# #################################
[features]
default = ["std"]

# Standard library. With it off, the crate is `no_std` (core + alloc).
# Also switches serde to its `std` flavour when the `serde` feature is on,
# so `SerialError` satisfies serde's `std::error::Error` bound.
std = ["serde?/std"]

# Derive macro support (#[derive(Serialize, Deserialize, DeserializeView)]),
# including every `#[pack_io(...)]` attribute: `version` / `since` /
# `deprecated` schema evolution, `skip`, `default`, `with`, `crate`, and
# explicit enum `index`. Pulls in the companion `pack-io-derive` crate.
derive = ["dep:pack-io-derive"]

# Alias for `derive`, kept so existing `features = ["schema"]` manifests
# keep working. The schema attributes have always been read by the derive
# macro itself; this feature adds nothing on top of `derive`.
schema = ["derive"]

# serde adapter (`pack_io::serde`): encode / decode any `serde` type on the
# pack-io wire, byte-identical to the native derive for the same shape.
serde = ["dep:serde"]

# `bytes` crate integration: `Serialize` / `Deserialize` for `Bytes` and
# `BytesMut`, plus `Encode` for `BytesMut` (write straight into a tokio
# codec buffer).
bytes = ["dep:bytes"]



# DEPENDENCIES
# #################################
[dependencies]
# Derive macro companion crate. The version is exactly pinned to the
# parent crate version so a downstream consumer cannot mix-and-match
# derive output across pack-io revisions.
pack-io-derive = { version = "=1.0.1", path = "pack-io-derive", optional = true }
# serde: the de-facto Rust serialization framework; maintained by
# dtolnay, no unsafe in the data-model traits we use, MSRV well below ours.
# Only the `alloc` feature is needed (owned error messages); `std` follows
# pack-io's own `std` feature.
serde          = { version = "1.0.220", optional = true, default-features = false, features = ["alloc"] }
# bytes: tokio's reference-counted byte buffers. Maintained by the tokio
# team, MSRV 1.39, no transitive dependencies. Optional and off by default.
bytes          = { version = "1.10", optional = true, default-features = false }



# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# criterion 0.7 is the newest line whose MSRV (1.80) fits ours; 0.8 needs
# 1.86. Plotting / HTML reports are off to keep the dev graph small.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest  = "1"
# Compile-fail UI tests for the derive macro's error messages.
trybuild  = "1.0.100"

# Comparative benchmark fixtures — only enter at bench / test compile
# time, never the published crate. Justified per REPS: each is a
# concrete competitor we measure ourselves against in `benches/comparative.rs`.
# bincode stays on the 2.x line on purpose: 3.0.0 is a tombstone release
# (`compile_error!`) after development ceased. The caret range never
# resolves to it.
bincode  = { version = "2.0.1", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["alloc", "use-std"] }
rkyv     = { version = "0.8.18", default-features = false, features = ["alloc", "bytecheck"] }
serde    = { version = "1", features = ["derive"] }



# BENCHMARKS
# #################################
[[bench]]
name              = "codec_bench"
harness           = false
required-features = ["derive"]

[[bench]]
name              = "comparative"
harness           = false
required-features = ["derive"]

[[bench]]
name              = "hot_paths"
harness           = false
required-features = ["derive"]

[[bench]]
name              = "min_trials"
harness           = false
required-features = ["derive"]

[[bench]]
name              = "features"
harness           = false
required-features = ["derive", "serde"]


# FEATURE-GATED EXAMPLES + TESTS
# #################################
# Cargo auto-discovers examples and integration tests from `examples/` and
# `tests/`. We declare the feature-using ones explicitly so `cargo build`
# (and rust-analyzer / clippy --all-targets) skip them cleanly when the
# required feature is off, instead of surfacing "cannot find type" /
# "cannot find derive macro" compile errors.
#
# Two feature tiers are gated here:
#
# 1. `std` — examples and tests that use `std::collections`, `std::io`,
#    `std::panic`, `println!`, or `proptest`. The `default = ["std"]`
#    feature is on for plain `cargo test`, so these run by default; they
#    are only skipped under explicit `--no-default-features`.
# 2. `derive` / `schema` — anything using the `#[derive(Serialize)]`
#    family of macros or the `#[pack_io(version = N)]` attribute family.

# --- Examples ---

[[example]]
name              = "basic_roundtrip"
required-features = ["std"]

[[example]]
name              = "primitive_tour"
required-features = ["std"]

[[example]]
name              = "collections_tour"
required-features = ["std"]

[[example]]
