[package]
name         = "pack-io-derive"
version      = "1.0.1"
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0 OR MIT"
readme       = "README.md"
description  = "Procedural macros for `pack-io`. Provides #[derive(Serialize, Deserialize, DeserializeView)]."
keywords     = ["serialization", "codec", "derive", "proc-macro", "pack-io"]
categories   = ["encoding", "development-tools::procedural-macro-helpers"]
homepage     = "https://github.com/jamesgober/pack-io"
repository   = "https://github.com/jamesgober/pack-io"
documentation = "https://docs.rs/pack-io-derive"
authors      = ["James Gober <me@jamesgober.com>"]
include      = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
# The standard proc-macro toolkit (dtolnay). syn stays on the 2.x line,
# which is still maintained; only `derive`-level parsing is used.
proc-macro2 = "1.0.95"
quote       = "1.0.40"
syn         = "2.0.100"
