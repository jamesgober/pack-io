#
# `cargo-fuzz` harness for pack-io. Deliberately excluded from the parent
# workspace so stable / MSRV builds of pack-io never compile this crate —
# `libfuzzer-sys` requires nightly + the AddressSanitizer instrumentation
# flags cargo-fuzz injects at build time.
#
# Invocation:
#
#     cargo +nightly fuzz run decode_string -- -max_total_time=30
#
# Each binary in `fuzz_targets/` is a separate fuzz target that feeds
# arbitrary bytes to one or more pack-io decode entry points. The contract
# under test is the same one the regular adversarial test suite enforces:
# the decoder MUST NOT panic, MUST NOT read past its input, MUST NOT
# allocate more than the input can back (CI runs every target with
# `-malloc_limit_mb=64`), and MUST NOT overflow the stack on nested input.
# The differential targets (`roundtrip`, `decode_view_derive`,
# `decode_serde`) additionally assert that independent decode paths agree.
#
# `corpus/<target>/` holds seed inputs (valid encodings of each target's
# types) that libFuzzer starts mutating from.

[package]
name         = "pack-io-fuzz"
version      = "0.0.0"
publish      = false
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0 OR MIT"
authors      = ["James Gober <me@jamesgober.com>"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pack-io       = { path = "..", features = ["derive", "serde"] }
serde         = { version = "1", features = ["derive"] }

# Each binary is a separate fuzz target. cargo-fuzz invokes them by name.
# Keep the list flat — one target per public decode entry point we want
# to harden against arbitrary input.

[[bin]]
name = "decode_string"
path = "fuzz_targets/decode_string.rs"
test = false
doc  = false

[[bin]]
name = "decode_vec_u8"
path = "fuzz_targets/decode_vec_u8.rs"
test = false
doc  = false

[[bin]]
name = "decode_tuple"
path = "fuzz_targets/decode_tuple.rs"
test = false
doc  = false

[[bin]]
name = "decode_collection"
path = "fuzz_targets/decode_collection.rs"
test = false
doc  = false

[[bin]]
name = "decode_view_str"
path = "fuzz_targets/decode_view_str.rs"
test = false
doc  = false

[[bin]]
name = "decode_struct_derive"
path = "fuzz_targets/decode_struct_derive.rs"
test = false
doc  = false

[[bin]]
name = "decode_enum_derive"
path = "fuzz_targets/decode_enum_derive.rs"
test = false
doc  = false

[[bin]]
name = "decode_versioned"
path = "fuzz_targets/decode_versioned.rs"
test = false
doc  = false

# Additional targets covering the BTreeMap / BTreeSet / HashSet decode
# paths plus the zero-copy borrow surface for &[u8] and Vec<&str>.

[[bin]]
name = "decode_btreemap"
path = "fuzz_targets/decode_btreemap.rs"
test = false
doc  = false

[[bin]]
name = "decode_btreeset"
path = "fuzz_targets/decode_btreeset.rs"
test = false
doc  = false

[[bin]]
name = "decode_hashset"
path = "fuzz_targets/decode_hashset.rs"
test = false
doc  = false

[[bin]]
name = "decode_view_bytes"
path = "fuzz_targets/decode_view_bytes.rs"
test = false
doc  = false

[[bin]]
name = "decode_view_collection"
path = "fuzz_targets/decode_view_collection.rs"
test = false
doc  = false

# Targets added in 2.0: recursion depth, the streaming decoder, the view
# derive (versioned frames included), differential round-trips with
# canonical-mode injectivity, and the serde adapter.

[[bin]]
name = "decode_recursive"
path = "fuzz_targets/decode_recursive.rs"
test = false
doc  = false

[[bin]]
name = "decode_io"
path = "fuzz_targets/decode_io.rs"
test = false
doc  = false

[[bin]]
name = "decode_view_derive"
path = "fuzz_targets/decode_view_derive.rs"
test = false
doc  = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc  = false

[[bin]]
name = "decode_serde"
path = "fuzz_targets/decode_serde.rs"
test = false
doc  = false

[[bin]]
name = "decode_zero_input"
path = "fuzz_targets/decode_zero_input.rs"
test = false
doc  = false

[[bin]]
name = "canonical_injective"
path = "fuzz_targets/canonical_injective.rs"
test = false
doc  = false

[profile.release]
debug = 1
